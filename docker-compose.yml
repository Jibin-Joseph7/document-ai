services:
  ai-service:
    build:
      context: ./ai-service
    ports:
      - "8000:8000"
    environment:
      AI_SERVICE_PORT: 8000
      CHROMA_PERSIST_DIR: /app/ai-service/chroma_store
      CHUNK_SIZE_WORDS: 200
      CHUNK_OVERLAP_WORDS: 40
      EMBEDDING_PROVIDER: local
      LLM_PROVIDER: none
    volumes:
      - chroma_store:/app/ai-service/chroma_store
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string}
      JWT_EXPIRES_IN: 7d
      SQLITE_PATH: /app/server/data/document_ai.sqlite
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: 25
      AI_SERVICE_URL: http://ai-service:8000
    volumes:
      - sqlite_data:/app/server/data
      - uploads:/app/uploads
    depends_on:
      ai-service:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  sqlite_data:
  uploads:
  chroma_store:
